name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests, formatting and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # `test:coverage` is the same suite plus the coverage gate declared in angular.json.
      - run: npm run test:coverage
      - run: npm run bff:test
      - run: npm run build

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end (recorded session, then the live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The broker is only for the last steps: the recorded suite runs first, with no backend
    # at all. Both suites share one job because installing the browsers (and their apt
    # dependencies) is the slowest, flakiest part of either, and it is the same work twice.
    services:
      kafka:
        image: apache/kafka:4.1.2
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          CLUSTER_ID: streamlens-kraft-01
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 5s --health-retries 24 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Step one: the product as it ships to GitHub Pages — the bundle serves the recording
      # in public/demo-stream.json, with no /api on the origin, so it needs no broker and no
      # network. Firefox only runs in CI: see E2E_BROWSERS in playwright.config.ts.
      - name: Recorded session suite (three engines)
        run: npm run test:e2e
        env:
          E2E_BROWSERS: chromium,firefox,webkit

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Step two: the same product with a Kafka broker behind it. Everything the browser
      # sees goes through the bridge, so it has to be up first — and `nohup` matters, since
      # the runner starts a fresh shell per step and the process must outlive its shell.
      - name: Install the BFF dependencies
        run: npm ci
        working-directory: bff

      - name: Start the bridge
        working-directory: bff
        run: |
          nohup npm start > /tmp/bff.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf localhost:4000/api/health | grep -Eq '"connected": *true' && break
            sleep 2
          done
          curl -sf localhost:4000/api/health | grep -Eq '"connected": *true' \
            || { echo 'the bridge never reached the broker'; tail -40 /tmp/bff.log; exit 1; }

      # Readiness is asserted through the dev server, not the bridge: that one request also
      # proves the proxy is wired, which is the path the browser will actually use.
      - name: Start the dev server
        run: |
          nohup npx ng serve --port 4200 > /tmp/ng.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf localhost:4200/api/health | grep -Eq '"connected": *true' && break
            sleep 2
          done
          curl -sf localhost:4200/api/health | grep -Eq '"connected": *true' \
            || { echo 'the dev server (or its proxy) never came up'; tail -40 /tmp/ng.log; exit 1; }

      # The only suite that can prove the README's Kafka claims: real offsets and lag, the
      # browser's murmur2 agreeing with the broker, and a rewind that really moves committed
      # offsets. Engines are the local default (chromium + webkit); the recorded run above is
      # where the full matrix lives.
      - name: Live suite (browser to bridge to broker)
        run: npm run test:e2e:live

      - name: Bridge and dev-server logs
        if: ${{ failure() }}
        run: tail -50 /tmp/bff.log /tmp/ng.log

      - name: Upload the Playwright report (live)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 7

  bff:
    name: BFF against a real broker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      kafka:
        image: apache/kafka:4.1.2
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          CLUSTER_ID: streamlens-kraft-01
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 5s --health-retries 24 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the BFF dependencies
        run: npm ci
        working-directory: bff

      # The hub's contracts — frame format, session sanitising, the pause/drain
      # backpressure and the buffer ceiling — hold without a broker, so they run first.
      - name: Bridge unit tests
        run: npm test
        working-directory: bff

      # Proves the client and the broker actually speak the same protocol: admin
      # calls, a produce/consume round trip and committed offsets.
      - name: Broker smoke test
        run: npm run smoke
        working-directory: bff

      # Boots the bridge and walks every HTTP route. A broken handler is invisible to
      # the Angular build, so this is the only place it can be caught before a browser
      # sees a 500.
      - name: Route smoke test
        run: npm run routes:smoke
        working-directory: bff
