<header class="topbar">
  <a class="brand" routerLink="/overview">
    <span class="brand__mark" aria-hidden="true">◉</span>
    <span class="brand__text">
      <strong>StreamLens</strong>
      <small class="faint">Kafka streams, observed from the browser</small>
    </span>
  </a>

  <nav class="nav" aria-label="Sections">
    <a routerLink="/overview" routerLinkActive="is-active">Overview</a>
    <a routerLink="/tail" routerLinkActive="is-active">Live tail</a>
    <a routerLink="/partitions" routerLinkActive="is-active">Partitions &amp; lag</a>
    <a routerLink="/key-router" routerLinkActive="is-active">Key router</a>
    <a routerLink="/architecture" routerLinkActive="is-active">How it works</a>
  </nav>

  <div class="topbar__status">
    <app-status-pill [mode]="store.mode()" [detail]="store.modeDetail()" />
    <span class="pill mono" [title]="'consumer group streamlens-ui-' + store.sessionId()">
      {{ store.sessionId().slice(0, 8) }}
    </span>
    <button
      type="button"
      class="btn"
      (click)="reconnect()"
      [disabled]="store.mode() === 'connecting'"
    >
      Reconnect
    </button>
    <button
      type="button"
      class="btn"
      (click)="theme.toggle()"
      [attr.aria-pressed]="theme.theme() === 'light'"
      [title]="'Switch to ' + (theme.theme() === 'light' ? 'dark' : 'light') + ' theme'"
    >
      <span aria-hidden="true">{{ theme.theme() === 'light' ? '☀' : '☾' }}</span>
      <span class="sr-only">Toggle colour theme</span>
    </button>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<footer class="footer faint">
  <span>Angular 22 · zoneless · signals — Node BFF over SSE — Kafka 4.1 (KRaft)</span>
  <span class="mono">{{ store.ready()?.groupId ?? 'no consumer group yet' }}</span>
</footer>
