<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>StreamLens — Kafka streams, observed from the browser</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Angular 22 dashboard for a real Kafka topic: live tail, partitions, consumer lag, offset replay and key partitioning, bridged over Server-Sent Events by a small Node BFF."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#12222b" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Runs before the first paint so the stored theme never flashes.
      (() => {
        try {
          const stored = localStorage.getItem('streamlens.theme');
          const prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
        } catch {
          /* storage unavailable (private mode): the CSS default applies */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
